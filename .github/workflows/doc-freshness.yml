name: Doc Freshness

# Enforces the Definition of Done from .claude/rules/standards.md:
# If code files change, CHANGELOG.md must also be updated in the same push.
#
# Covers: scripts/, _templates/, netlify/, assets/js/, styles.css, index.html
# Excludes: docs-only changes, content/articles/ (managed separately)

# Runs on BOTH events, deliberately:
#   pull_request — this is where it gates. It is a required status check on main,
#     and a required check that only ever runs on push can never report on a PR,
#     so every PR into main sat permanently BLOCKED with no action the author
#     could take (#100). Only an admin override got anything through, which meant
#     the rule was never actually enforced at the point it was supposed to be.
#   push — kept as the backstop for anything reaching main another way (admin
#     merge, direct push).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changelog-updated:
    name: CHANGELOG updated with code changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — the diff covers the whole push range, not just the last commit

      - name: Determine diff base
        id: diff_base
        run: |
          # Both events judge a whole unit of work, not a single commit: a CHANGELOG
          # entry anywhere in the PR (or the push) satisfies the check.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # HEAD is the refs/pull/N/merge commit; its FIRST PARENT is the current
            # tip of the base branch at merge-simulation time. Diffing from HEAD^1
            # therefore isolates exactly this PR's changes.
            # NOT merge-base(base.sha, HEAD): base.sha can lag the real base tip,
            # and since it is always an ancestor of the merge commit, merge-base
            # just returns base.sha — a no-op that attributed every commit landed
            # on main since to this PR, so someone else's CHANGELOG entry could
            # satisfy the check for a PR that never wrote one (#105).
            BASE=$(git rev-parse HEAD^1)
          else
            # Diff the whole push (before..after). Fall back to HEAD~1 when 'before'
            # is unavailable (new branch or force push).
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
            fi
          fi
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "Event: ${{ github.event_name }} — diffing against base: ${BASE:-<repo root — single-commit history>}"

      - name: Check if code files changed
        id: code_changed
        run: |
          BASE="${{ steps.diff_base.outputs.base }}"
          if [ -z "$BASE" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No diff base available — skipping check."
            exit 0
          fi
          CODE_CHANGED=$(git diff --name-only "$BASE" HEAD | grep -E \
            '^(scripts/|_templates/|netlify/|assets/js/|styles\.css|index\.html)' \
            | grep -v '\.md$' || true)
          if [ -n "$CODE_CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Files changed:"
            echo "$CODE_CHANGED"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No tracked code files changed — skipping check."
          fi

      - name: Check CHANGELOG.md was updated
        if: steps.code_changed.outputs.changed == 'true'
        run: |
          CHANGELOG_CHANGED=$(git diff --name-only "${{ steps.diff_base.outputs.base }}" HEAD | grep '^CHANGELOG\.md$' || true)
          if [ -z "$CHANGELOG_CHANGED" ]; then
            echo ""
            echo "❌ CHANGELOG.md was not updated."
            echo ""
            echo "Code files changed in this push but CHANGELOG.md was not touched."
            echo "Per .claude/rules/standards.md (Definition of Done), every meaningful code change"
            echo "requires a CHANGELOG.md entry under [Unreleased]."
            echo ""
            echo "Add an entry and push again."
            exit 1
          else
            echo "✅ CHANGELOG.md updated — Definition of Done satisfied."
          fi

  roadmap-sanity:
    name: ROADMAP has no stale [x] items in NOW section
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for completed items still in NOW section
        run: |
          # Extract the NOW section and check for [x] items
          # Warn (don't fail) — this is advisory
          NOW_DONE=$(awk '/^## 🟢 NOW/,/^## 🟡 NEXT/' ROADMAP.md | grep '^\- \[x\]' || true)
          if [ -n "$NOW_DONE" ]; then
            echo "⚠️  Warning: completed items found in the NOW section of ROADMAP.md:"
            echo "$NOW_DONE"
            echo ""
            echo "Consider moving these to the Done section."
            echo "(This is a warning, not a failure — update ROADMAP.md when convenient.)"
          else
            echo "✅ ROADMAP NOW section looks clean."
          fi
