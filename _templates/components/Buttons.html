<div class="ds-subsection">
  <h3 class="ds-subsection-title">Buttons</h3>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-3)">Variants · md (default) size</p>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);margin-bottom:var(--space-8)">
    <button class="btn btn--primary">Primary</button>
    <button class="btn btn--accent">Accent</button>
    <button class="btn btn--outline">Outline</button>
    <button class="btn btn--ghost">Ghost</button>
    <a href="#" class="btn btn--link">Link</a>
  </div>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-3)">Sizes · btn--primary</p>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);margin-bottom:var(--space-8)">
    <button class="btn btn--primary btn--sm">Small · 32px</button>
    <button class="btn btn--primary">Medium · 40px</button>
    <button class="btn btn--primary btn--lg">Large · 48px</button>
  </div>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-3)">Disabled state</p>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);margin-bottom:var(--space-8)">
    <button class="btn btn--primary" disabled>Primary</button>
    <button class="btn btn--accent" disabled>Accent</button>
    <button class="btn btn--outline" disabled>Outline</button>
    <button class="btn btn--ghost" disabled>Ghost</button>
  </div>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-3)">On dark surface</p>
  <div style="background:var(--bg-dark);padding:var(--space-6);border-radius:var(--radius-lg);display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)">
    <button class="btn btn--accent">Apply now</button>
    <button class="btn btn--outline" style="color:var(--fg-on-dark);border-color:rgba(255,255,255,0.3)">Learn more</button>
    <a href="#" class="btn btn--link" style="color:rgba(255,255,255,0.7)">View details</a>
  </div>
</div>
