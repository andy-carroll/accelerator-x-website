<!-- CaseTile — standard variant
     For the feature (lead) variant, add data-variant="feature" to .ax-case-tile.
     Replace src/alt on the cover image when real photography lands. -->
<article class="ax-case-tile" data-variant="standard">
  <div class="ax-case-tile__cover">
    <img
      src="/assets/img/case-studies/retail-group-hero.jpg"
      alt=""
      loading="lazy"
      width="600"
      height="400"
    >
  </div>
  <div class="ax-case-tile__body">
    <div class="ax-case-tile__meta">
      <span class="ax-case-tile__sector">Retail</span>
      <span class="ax-case-tile__meta-sep">·</span>
      <span class="ax-case-tile__meta-text">£45M revenue</span>
      <span class="ax-case-tile__meta-sep">·</span>
      <span class="ax-case-tile__meta-text">8-Week Cycle</span>
    </div>
    <h3 class="ax-case-tile__heading">
      <a href="/case-studies/retail-group-backlog/" style="color:inherit;text-decoration:none;">
        How a £45M retail group cut backlog 60% in one cycle.
      </a>
    </h3>
    <p class="ax-case-tile__sub">Eight weeks. Three operators. One production system the ops team runs without us.</p>
    <div class="ax-case-tile__metrics">
      <div>
        <div class="ax-case-tile__metric-value">60%</div>
        <div class="ax-case-tile__metric-label">Backlog reduction</div>
      </div>
      <div>
        <div class="ax-case-tile__metric-value">£420k</div>
        <div class="ax-case-tile__metric-label">Annualised saving</div>
      </div>
      <div>
        <div class="ax-case-tile__metric-value">11×</div>
        <div class="ax-case-tile__metric-label">Return on fee</div>
      </div>
    </div>
  </div>
</article>
