<div class="ds-subsection">
  <h3 class="ds-subsection-title">Chips</h3>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-3)">Variants</p>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-8)">
    <button class="chip">Default</button>
    <button class="chip chip--selected" aria-selected="true">Selected</button>
    <span class="chip chip--kicker">AI Strategy</span>
  </div>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-3)">Filter group · mixed selection</p>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-8)">
    <button class="chip chip--selected" aria-selected="true">All</button>
    <button class="chip">Strategy</button>
    <button class="chip">Implementation</button>
    <button class="chip chip--selected" aria-selected="true">Leadership</button>
    <button class="chip">Case Studies</button>
    <button class="chip">Tools</button>
  </div>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-3)">Kicker chips · section labels</p>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-8)">
    <span class="chip chip--kicker">Cohort 4</span>
    <span class="chip chip--kicker">September 2026</span>
    <span class="chip chip--kicker">8 Weeks</span>
  </div>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-3)">Status pills</p>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2)">
    <span class="chip pill-success">Completed</span>
    <span class="chip pill-warning">In progress</span>
    <span class="chip pill-error">Blocked</span>
  </div>
</div>
