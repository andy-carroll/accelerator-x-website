<!-- CohortList — active programme instances.
     Add [hidden] to the <section> when no cohorts are live — it collapses entirely.
     Data wiring (cohorts.json → 11ty) is Phase 3. Replace sample rows with real data.
     Only use on cohort-based programme pages (Leadership Cohort, Senior Leader Acceleration). -->
<section class="ax-cohort-list" aria-label="Upcoming cohorts">
  <div class="ax-cohort-list__header">
    <h3 class="ax-cohort-list__title">Upcoming cohorts</h3>
    <span class="ax-cohort-list__count">2 open</span>
  </div>

  <div class="ax-cohort-list__row">

      <span class="ax-cohort-list__label">Starts</span>
      <span class="ax-cohort-list__value">12 Aug 2026</span>
      <span class="ax-cohort-list__sub">8 weeks</span>
    </div>
    <div class="ax-cohort-list__cell">
      <span class="ax-cohort-list__label">Location</span>
      <span class="ax-cohort-list__value">Miami</span>
      <span class="ax-cohort-list__sub">+ remote sessions</span>
    </div>
    <div class="ax-cohort-list__cell">
      <span class="ax-cohort-list__label">Audience</span>

      <span class="ax-cohort-list__sub">6 places · 2 left</span>

      <a href="/contact/" class="btn btn--primary btn--sm">Apply</a>

  </div>

  <div class="ax-cohort-list__row">
