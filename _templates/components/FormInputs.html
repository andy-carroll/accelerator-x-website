<div class="ds-subsection">
  <h3 class="ds-subsection-title">Form Inputs</h3>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-4)">States · text input</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-5);margin-bottom:var(--space-8)">
    <div class="field">
      <label class="field-label">Default</label>
      <input type="text" class="input" placeholder="Placeholder text">
    </div>
    <div class="field">
      <label class="field-label">With value</label>
      <input type="text" class="input" value="Chief Executive Officer">
    </div>
    <div class="field">
      <label class="field-label">Error state <span class="required">*</span></label>
      <input type="email" class="input input--error" value="not-an-email">
      <span class="field-helper field-helper--error">Please enter a valid email address.</span>
    </div>
    <div class="field">
      <label class="field-label">Disabled</label>
      <input type="text" class="input" value="Read-only value" disabled>
      <span class="field-helper">Populated from your profile.</span>
    </div>
  </div>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-4)">Select</p>
  <div style="max-width:360px;margin-bottom:var(--space-8)">
    <div class="field">
      <label class="field-label">Organisation size</label>
      <select class="select">
        <option value="">Select…</option>
        <option>50–200 employees</option>
        <option>200–1,000 employees</option>
        <option selected>1,000–5,000 employees</option>
        <option>5,000+ employees</option>
      </select>
    </div>
  </div>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-4)">Textarea</p>
  <div class="field" style="margin-bottom:var(--space-8)">
    <label class="field-label">Tell us about your AI ambitions</label>
    <textarea class="textarea" rows="4" placeholder="Describe the transformation outcomes you're looking to achieve…"></textarea>
    <span class="field-helper">This helps us tailor the programme to your context.</span>
  </div>

  <p style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-4);margin:0 0 var(--space-4)">Full field · real-world example</p>
  <div style="background:var(--bg-2);padding:var(--space-6);border-radius:var(--radius-lg);max-width:520px">
    <div style="display:grid;gap:var(--space-5)">
      <div class="field">
        <label class="field-label">Full name <span class="required">*</span></label>
        <input type="text" class="input" placeholder="Jane Smith">
      </div>
      <div class="field">
        <label class="field-label">Work email <span class="required">*</span></label>
        <input type="email" class="input" placeholder="jane@company.com">
      </div>
      <div class="field">
        <label class="field-label">Organisation size</label>
        <select class="select">
          <option value="">Select…</option>
          <option>50–200 employees</option>
          <option>200–1,000 employees</option>
        </select>
      </div>
      <button class="btn btn--accent btn--lg" style="width:100%">Request your place</button>
    </div>
  </div>
</div>
