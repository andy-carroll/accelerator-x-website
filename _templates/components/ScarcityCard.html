<!-- ScarcityCard — programme availability signal.
     Two variants: --cohort (deadline + places) and --open (lead-time framing).
     Only show on cohort-based programme pages. Company Enablement uses --open.
     Numbers must be real — no placeholder urgency copy. -->

<!-- Cohort variant: deadline + places remaining -->
<div class="ax-scarcity-card ax-scarcity-card--cohort" role="region" aria-label="Programme availability">
  <div class="ax-scarcity-card__body">
    <p class="ax-scarcity-card__status">Applications closing</p>
    <p class="ax-scarcity-card__primary">Applications close 29 July · 6 places left</p>
    <p class="ax-scarcity-card__secondary">Leadership Cohort · Q3 2026 · London &amp; remote</p>
  </div>
  <div class="ax-scarcity-card__cta">
    <a href="/contact/" class="btn btn--primary">Apply now</a>
  </div>
</div>

<!-- Open / lead-time variant -->
<div class="ax-scarcity-card ax-scarcity-card--open" role="region" aria-label="Programme availability">
  <div class="ax-scarcity-card__body">
    <p class="ax-scarcity-card__status">Availability</p>
    <p class="ax-scarcity-card__primary">Typical start 3 weeks from signing</p>
    <p class="ax-scarcity-card__secondary">2–3 new engagements per quarter · we'll tell you if we're full</p>
  </div>
  <div class="ax-scarcity-card__cta">
    <a href="/contact/" class="btn btn--primary">Apply to work with us</a>
  </div>
</div>
