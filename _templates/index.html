<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accelerator X Insights | The Authority Engine</title>
    <meta name="description" content="Deep strategy and real implementation for AI transformation." />

    <link rel="canonical" href="{{site_url}}/insights/index.html" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/icons/AX-icon.png" sizes="any" />
    <link rel="shortcut icon" type="image/png" href="/assets/icons/AX-icon.png" />

    <!-- Fonts & Styles -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Aptos.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Aptos-Bold.woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/assets/css/bundle.generated.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" /></noscript>

    <!-- Open Graph SEO -->
    <meta property="og:title" content="Accelerator X Insights" />
    <meta property="og:description" content="Tools, frameworks, and raw dispatches on making AI work in the real world." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Accelerator X" />
    <script defer src="/assets/js/analytics.js"></script>
  </head>
  
  <body class="bg-surface text-navy min-h-screen flex flex-col">
    {{component:Nav}}

    <main id="main-content" class="flex-grow">
      
      <!-- Micro Hero & Guided Pathways -->
      <section class="bg-navy py-16 lg:py-24 text-center px-4 border-b-4 border-primary">
        <div class="mx-auto max-w-4xl">
          <h1 class="font-display text-4xl lg:text-5xl font-bold text-background mb-4">Accelerator X Insights</h1>
          <p class="text-xl text-background/80 mb-12">Tools, frameworks, and raw dispatches on making AI work in the real world.</p>
          
          <!-- Guided Pathways (Start Here Constraint) -->
          <div class="flex flex-col md:flex-row justify-center gap-4 mt-8">
            <a href="#strategy" class="pathway-tile card-hoverable bg-background text-navy px-6 py-6 rounded-xl flex flex-col items-center transition-all duration-300">
              <span class="text-sm font-bold uppercase tracking-wider text-primary mb-1">For Leaders</span>
              <span class="pathway-label font-display font-bold text-lg">Strategy</span>
            </a>
            <a href="#capability" class="pathway-tile card-hoverable bg-background text-navy px-6 py-6 rounded-xl flex flex-col items-center transition-all duration-300">
              <span class="text-sm font-bold uppercase tracking-wider text-accent mb-1">For Teams</span>
              <span class="pathway-label font-display font-bold text-lg">Capability</span>
            </a>
            <a href="#tooling" class="pathway-tile card-hoverable bg-background text-navy px-6 py-6 rounded-xl flex flex-col items-center transition-all duration-300">
              <span class="text-sm font-bold uppercase tracking-wider text-amber mb-1">Tech &amp; AI</span>
              <span class="pathway-label font-display font-bold text-lg">Tooling</span>
            </a>
          </div>
        </div>
      </section>

      <!-- Weekly dispatch — in content flow (top third), well above the footer band -->
      {{component:NewsletterSignup}}

      <!-- Feed Matrix -->
      <section class="py-16 lg:py-24 px-4 bg-surface">
        <div class="mx-auto max-w-6xl">
          <div class="flex items-center justify-between mb-8 border-b border-surface-2 pb-4">
            <h2 id="feed-title" class="font-display text-3xl font-bold text-navy">Latest Frameworks & Dispatches</h2>
            <button id="show-all" class="text-sm font-bold uppercase tracking-widest text-primary hidden hover:underline">Show All</button>
          </div>
          
          <!-- Automatically populated list of content cards parsed from Markdown frontmatter -->
          <div id="article-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 transition-all duration-300">
            {{articlesList}}
          </div>
        </div>
      </section>

    </main>

    {{component:Footer}}

    <script defer src="/assets/js/nav.js"></script>
    <script defer src="/assets/js/hub-filter.js"></script>
  </body>
</html>
